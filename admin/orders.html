<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单管理 · 武陵果园管理后台</title>
  <link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/front.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-body" data-admin-page="orders">
  <div class="admin-shell">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <div class="admin-overlay" id="adminOverlay"></div>
    <div class="admin-main">
      <header class="admin-topbar" id="adminTopbar"></header>
      <main class="admin-content">
        <div class="page-head">
          <div><h1>订单管理</h1><p class="ph-desc">处理顾客订单、更新履约状态，查看收货与备注信息。</p></div>
          <div class="page-head-actions"><span class="badge badge-warning" id="pendingOrderTip">待发货 0 笔</span></div>
        </div>

        <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)" id="orderKpis"></div>

        <section class="data-card">
          <div class="table-toolbar">
            <div class="tt-left">
              <div class="admin-search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input class="input" id="orderSearch" type="search" placeholder="搜索订单号、客户或手机号">
              </div>
              <select class="select table-filter" id="orderStatusFilter">
                <option value="">全部状态</option><option value="待付款">待付款</option><option value="待发货">待发货</option><option value="已发货">已发货</option><option value="已完成">已完成</option><option value="已取消">已取消</option>
              </select>
            </div>
            <div class="tt-right"><span class="text-muted" style="font-size:10.5px" id="orderTotalTip">共 0 笔订单</span></div>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>订单号 / 时间</th><th>客户</th><th>商品</th><th>金额</th><th>支付方式</th><th>状态</th><th>操作</th></tr></thead>
              <tbody id="orderTableBody"></tbody>
            </table>
          </div>
          <div class="table-foot" id="orderTableFoot"></div>
        </section>
      </main>
    </div>
  </div>

  <div id="toastRoot"></div>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
