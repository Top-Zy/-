<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台登录 · 武陵山区果园管理系统</title>
  <meta name="description" content="武陵山区果园管理系统后台登录入口。">
  <link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/front.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-body" data-admin-page="login">
  <main class="admin-login-page">
    <section class="login-visual">
      <img class="bg" src="../assets/img/orchard-1.jpg" alt="">
      <div class="lv-brand">
        <img src="../assets/img/logo.svg" alt="武陵果园">
        <div><div class="lvb-name">武陵果园 · 管理后台</div><div class="lvb-sub">WULING ORCHARD ADMIN</div></div>
      </div>
      <div class="lv-copy">
        <span class="eyebrow">MANAGEMENT CONSOLE</span>
        <h1>把一片果园，<br>管得明明白白。</h1>
        <p>果园档案、产品库存、订单履约、客户留言和内容运营，集中在一个后台。让每一次采收和每一笔订单，都有据可查。</p>
        <div class="lv-features">
          <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>管理员身份校验与页面访问控制</div>
          <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>销售趋势、库存预警与经营数据看板</div>
          <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="M12 22V12"/></svg>订单、预约、留言一站式处理</div>
        </div>
      </div>
      <div class="lv-foot">© 2026 武陵山区果园管理系统 · 计算机应用技术专业毕业设计</div>
    </section>

    <section class="login-form-side">
      <div class="login-card">
        <img class="lc-logo" src="../assets/img/logo.svg" alt="武陵果园">
        <h2>管理员登录</h2>
        <p class="lc-sub">请使用后台管理员账号进入系统</p>
        <form id="adminLoginForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="adminAccount">管理员账号</label>
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input class="input" id="adminAccount" type="text" placeholder="请输入管理员账号" autocomplete="username" value="admin">
            </div>
            <div class="field-error" data-error="account"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="adminPassword">登录密码</label>
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input class="input" id="adminPassword" type="password" placeholder="请输入登录密码" autocomplete="current-password" style="padding-right:44px">
              <button type="button" class="pw-toggle" data-toggle-password="adminPassword" aria-label="显示密码"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
            <div class="field-error" data-error="password"></div>
          </div>
          <button class="btn btn-primary btn-block btn-lg" type="submit">进入管理后台</button>
        </form>
        <div class="lc-tip"><strong>演示账号：</strong>admin　<strong>密码：</strong>admin123<br>本系统为毕业设计演示环境，数据保存在浏览器本地。</div>
        <a class="lc-back" href="../index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>返回前台首页</a>
      </div>
    </section>
  </main>

  <div id="toastRoot"></div>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
