<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 · 武陵果园管理后台</title>
  <link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/front.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-body" data-admin-page="users">
  <div class="admin-shell">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <div class="admin-overlay" id="adminOverlay"></div>
    <div class="admin-main">
      <header class="admin-topbar" id="adminTopbar"></header>
      <main class="admin-content">
        <div class="page-head">
          <div><h1>用户管理</h1><p class="ph-desc">查看注册用户、账户状态与消费情况，处理账号启停。</p></div>
          <div class="page-head-actions"><span class="badge badge-success" id="userTotalTip">共 0 位用户</span></div>
        </div>

        <section class="data-card">
          <div class="table-toolbar">
            <div class="tt-left">
              <div class="admin-search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input class="input" id="userSearch" type="search" placeholder="搜索姓名、用户名或手机号">
              </div>
              <select class="select table-filter" id="userStatusFilter"><option value="">全部状态</option><option value="正常">正常</option><option value="停用">停用</option></select>
              <select class="select table-filter" id="userRoleFilter"><option value="">全部角色</option><option value="user">普通用户</option><option value="admin">管理员</option></select>
            </div>
            <div class="tt-right"><span class="text-muted" style="font-size:10.5px" id="userDataTip"></span></div>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>用户</th><th>手机号</th><th>角色</th><th>订单数</th><th>累计消费</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead>
              <tbody id="userTableBody"></tbody>
            </table>
          </div>
          <div class="table-foot" id="userTableFoot"></div>
        </section>
      </main>
    </div>
  </div>

  <div id="toastRoot"></div>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
