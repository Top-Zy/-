<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>留言管理 · 武陵果园管理后台</title>
  <link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/front.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-body" data-admin-page="messages">
  <div class="admin-shell">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <div class="admin-overlay" id="adminOverlay"></div>
    <div class="admin-main">
      <header class="admin-topbar" id="adminTopbar"></header>
      <main class="admin-content">
        <div class="page-head">
          <div><h1>留言管理</h1><p class="ph-desc">处理前台咨询、团购需求与售后反馈，及时回复客户。</p></div>
          <div class="page-head-actions"><span class="badge badge-warning" id="pendingMessageTip">待回复 0 条</span></div>
        </div>

        <section class="data-card">
          <div class="table-toolbar">
            <div class="tt-left">
              <div class="admin-search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input class="input" id="messageSearch" type="search" placeholder="搜索姓名、手机号或留言内容">
              </div>
              <select class="select table-filter" id="messageStatusFilter"><option value="">全部状态</option><option value="待回复">待回复</option><option value="已回复">已回复</option></select>
            </div>
            <div class="tt-right"><span class="text-muted" style="font-size:10.5px" id="messageTotalTip">共 0 条留言</span></div>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>留言人</th><th>联系方式</th><th>留言内容</th><th>状态</th><th>时间</th><th>操作</th></tr></thead>
              <tbody id="messageTableBody"></tbody>
            </table>
          </div>
          <div class="table-foot" id="messageTableFoot"></div>
        </section>
      </main>
    </div>
  </div>

  <div id="toastRoot"></div>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
