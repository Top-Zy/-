<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>确认订单 · 武陵果园</title>
  <meta name="description" content="确认收货信息并提交武陵果园订单。">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/front.css">
</head>
<body data-page="checkout">
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <div class="breadcrumb"><a href="index.html">首页</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 18 6-6-6-6"/></svg><a href="cart.html">购物车</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 18 6-6-6-6"/></svg><span class="current">确认订单</span></div>
        <h1>确认订单</h1>
        <p class="page-desc">核对收货信息与商品明细后提交。演示环境会模拟支付成功，订单直接进入“待发货”。</p>
      </div>
    </section>

    <section class="section" style="padding-top:40px">
      <div class="container" id="checkoutLayout">
        <form id="checkoutForm" class="checkout-layout" novalidate>
          <div>
            <section class="checkout-section">
              <h2><span class="step-no">1</span>收货信息</h2>
              <div class="form-grid">
                <div class="form-group">
                  <label class="form-label" for="checkoutName">收货人 <span class="req">*</span></label>
                  <input class="input" id="checkoutName" name="name" type="text" placeholder="请输入收货人姓名" maxlength="20" autocomplete="name">
                  <div class="field-error" data-error="name"></div>
                </div>
                <div class="form-group">
                  <label class="form-label" for="checkoutPhone">手机号 <span class="req">*</span></label>
                  <input class="input" id="checkoutPhone" name="phone" type="tel" placeholder="11 位手机号" maxlength="11" autocomplete="tel">
                  <div class="field-error" data-error="phone"></div>
                </div>
                <div class="form-group full">
                  <label class="form-label" for="checkoutAddress">详细地址 <span class="req">*</span></label>
                  <input class="input" id="checkoutAddress" name="address" type="text" placeholder="省 / 市 / 区（县）/ 街道 / 门牌号" autocomplete="street-address">
                  <div class="field-error" data-error="address"></div>
                </div>
                <div class="form-group full">
                  <label class="form-label" for="checkoutRemark">订单备注 <span class="text-muted" style="font-weight:400">（选填）</span></label>
                  <textarea class="textarea" id="checkoutRemark" name="remark" placeholder="例如：周末在家、需要礼盒包装、发票抬头等" style="min-height:82px" maxlength="200"></textarea>
                </div>
              </div>
            </section>

            <section class="checkout-section">
              <h2><span class="step-no">2</span>配送方式</h2>
              <div class="pay-options" style="grid-template-columns:1fr 1fr">
                <div class="pay-option"><input type="radio" name="shipping" id="shipCold" value="冷链配送" checked><label for="shipCold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>冷链配送 · 48h 内发出</label></div>
                <div class="pay-option"><input type="radio" name="shipping" id="shipPickup" value="果园自提"><label for="shipPickup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>果园自提 · 提前预约</label></div>
              </div>
            </section>

            <section class="checkout-section">
              <h2><span class="step-no">3</span>支付方式</h2>
              <div class="pay-options">
                <div class="pay-option"><input type="radio" name="payMethod" id="payWechat" value="微信支付" checked><label for="payWechat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8.5 3C4.36 3 1 5.69 1 9c0 1.89 1.08 3.56 2.78 4.66L3 16l2.5-1.4c.93.26 1.93.4 2.99.4 4.14 0 7.5-2.69 7.5-6S12.64 3 8.5 3Z"/></svg>微信支付</label></div>
                <div class="pay-option"><input type="radio" name="payMethod" id="payAlipay" value="支付宝"><label for="payAlipay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M8 9h8M12 6v6M7 15c3 2 7 1 10-2"/></svg>支付宝</label></div>
                <div class="pay-option"><input type="radio" name="payMethod" id="payBank" value="银行卡"><label for="payBank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>银行卡</label></div>
              </div>
              <p class="text-muted" style="font-size:11px;margin-top:12px">演示环境不接入真实支付，提交后直接模拟支付成功。</p>
            </section>

            <div class="checkout-section" style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
              <a href="cart.html" class="btn btn-ghost btn-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>返回购物车</a>
              <button class="btn btn-citrus btn-lg" type="submit" id="submitOrderBtn">提交订单</button>
            </div>
          </div>

          <aside class="order-summary">
            <h3>订单明细</h3>
            <div id="checkoutItems" class="checkout-items"></div>
            <div class="sum-row" style="margin-top:16px"><span>商品金额</span><strong id="checkoutSubtotal">¥0</strong></div>
            <div class="sum-row"><span>运费</span><strong id="checkoutShipping">满 99 元包邮</strong></div>
            <div class="sum-row total"><span>应付总额</span><span class="amount" id="checkoutTotal">¥0</span></div>
            <div class="mt-3" style="background:var(--leaf-100);border-radius:10px;padding:11px 13px;font-size:11px;color:var(--forest-600);line-height:1.8">产地直发 · 坏果包赔<br>下单后可在“个人中心”查看订单进度。</div>
          </aside>
        </form>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/front.js"></script>
</body>
</html>
