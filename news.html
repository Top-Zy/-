<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>果业资讯 · 武陵果园</title>
  <meta name="description" content="武陵山区果园动态、种植知识、活动公告与行业资讯。">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/front.css">
</head>
<body data-page="news">
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <div class="breadcrumb"><a href="index.html">首页</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 18 6-6-6-6"/></svg><span class="current">果业资讯</span></div>
        <h1>果园来信</h1>
        <p class="page-desc">采收消息、种植知识、活动公告和来自山里的新鲜事。我们记录果园的四季，也记录一群人的认真。</p>
        <div class="hero-chips"><span>平台动态</span><span>基地来信</span><span>种植知识</span><span>活动公告</span></div>
      </div>
    </section>

    <section class="section" style="padding-top:48px">
      <div class="container">
        <div class="list-toolbar">
          <div class="chips-scroll" id="newsFilters">
            <button class="filter-chip active" data-category="全部">全部资讯</button>
            <button class="filter-chip" data-category="平台动态">平台动态</button>
            <button class="filter-chip" data-category="基地动态">基地动态</button>
            <button class="filter-chip" data-category="种植知识">种植知识</button>
            <button class="filter-chip" data-category="活动公告">活动公告</button>
            <button class="filter-chip" data-category="行业资讯">行业资讯</button>
          </div>
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input class="input" id="newsSearch" type="search" placeholder="搜索资讯标题或关键词" aria-label="搜索资讯">
          </div>
        </div>
        <div class="list-toolbar" style="margin-top:-12px">
          <p class="result-count">共 <strong id="newsCount">6</strong> 篇果园来信</p>
          <p class="text-muted" style="font-size:12px">按发布时间排序</p>
        </div>
        <div class="news-grid" id="newsList"></div>
      </div>
    </section>

    <section class="section section-paper" style="padding-top:54px;padding-bottom:54px">
      <div class="container">
        <div class="cta-band" style="background:var(--forest-700)">
          <div class="cta-copy"><h2 style="font-size:28px">想第一时间收到果园来信？</h2><p>关注采收提醒、活动预告和种植知识，每月一封，不打扰。</p></div>
          <div class="cta-actions"><a class="btn btn-citrus" href="contact.html">订阅果园来信</a></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/front.js"></script>
